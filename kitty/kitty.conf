# ============================================================
# KITTY — RAW UNIX / ACCENT
# monochrome base • muted secondary tones • white focus accent
# ============================================================

# ------------------------------------------------------------
# FONT
# ------------------------------------------------------------

font_family      Iosevka Term
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        12.0


# ------------------------------------------------------------
# WINDOW
# ------------------------------------------------------------

window_padding_width 20

background_opacity 1.0

confirm_os_window_close 0


# ------------------------------------------------------------
# CORE PALETTE
# ------------------------------------------------------------

background            #050505
foreground            #BDBDBD

cursor                 #FFFFFF
cursor_text_color      #050505

selection_background  #1A1A1A
selection_foreground  #FFFFFF

url_color              #8D98A8


# ------------------------------------------------------------
# TABS
# ------------------------------------------------------------

tab_bar_style powerline

active_tab_background    #FFFFFF
active_tab_foreground    #050505

inactive_tab_background  #0A0A0A
inactive_tab_foreground  #6C6C6C


# ------------------------------------------------------------
# ANSI COLORS
# ------------------------------------------------------------

# BLACK
color0   #050505
color8   #3A3A3A

# RED
color1   #8E6F73
color9   #B08A8F

# GREEN
color2   #78877A
color10  #96A398

# YELLOW
color3   #958870
color11  #B6A78A

# BLUE
color4   #738296
color12  #91A1B7

# MAGENTA
color5   #85778F
color13  #A494AE

# CYAN
color6   #748A8C
color14  #93A8AA

# WHITE
color7   #BDBDBD
color15  #FFFFFF


# ------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------

cursor_shape beam
cursor_blink_interval 0


# ------------------------------------------------------------
# SCROLLBACK
# ------------------------------------------------------------

scrollback_lines 10000

wheel_scroll_multiplier 5.0


# ------------------------------------------------------------
# BELL
# ------------------------------------------------------------

enable_audio_bell no
visual_bell_duration 0.0


# ------------------------------------------------------------
# OPTIONAL VISUAL TUNING
# ------------------------------------------------------------

inactive_text_alpha 0.85

draw_minimal_borders yes
