<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Start</title>

  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #101010;
      --text: #c9c9c9;
      --soft: #858585;
      --muted: #555;
      --faint: #323232;
      --line: #1d1d1d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      min-height: 100vh;
      padding: clamp(28px, 5vw, 72px);
      display: grid;
      place-items: center;
    }

    .page {
      width: min(1080px, 100%);
      min-height: min(720px, calc(100vh - 80px));
      display: grid;
      grid-template-columns: minmax(300px, .9fr) minmax(380px, 1.1fr);
      gap: clamp(28px, 4vw, 56px);
      align-items: center;
    }

    /* LEFT / IMAGE */
    .visual {
      display: grid;
      align-content: center;
      justify-items: start;
      gap: 14px;
    }

    .image-slot {
      width: min(100%, 430px);
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,.014), transparent 40%),
        var(--surface);
      border: 1px solid #171717;
      position: relative;
    }

    .image-slot::after {
      content: "image";
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: #272727;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .image-slot:has(img)::after {
      display: none;
    }

    .image-slot img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .visual-note {
      color: #343434;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* RIGHT / CONTENT */
    .content {
      min-width: 0;
      display: grid;
      gap: clamp(44px, 7vh, 72px);
    }

    /* EXCHANGE */
    .exchange {
      width: min(100%, 390px);
      justify-self: start;
      margin-left: -8px;
    }

    .section-label {
      margin: 0 0 12px;
      color: #383838;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .rates {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .rates li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
      min-height: 48px;
      border-bottom: 1px solid var(--line);
    }

    .rate-name {
      color: #515151;
      font-size: 12px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .rate-value {
      color: #777;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* LINKS */
    .links-area {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: clamp(24px, 4vw, 48px);
      row-gap: 42px;
    }

    .link-group {
      min-width: 0;
    }

    .group-title {
      margin: 0 0 14px;
      color: #3d3d3d;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .link-list {
      display: grid;
      gap: 12px;
    }

    a {
      width: fit-content;
      max-width: 100%;
      color: #707070;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .15s ease, transform .15s ease;
    }

    a:hover,
    a:focus-visible {
      color: #d0d0d0;
      transform: translateX(2px);
      outline: none;
    }


    @media (min-width: 1100px) and (max-width: 1600px) {
      .page {
        width: min(1180px, 96vw);
        grid-template-columns: minmax(340px, .92fr) minmax(500px, 1.08fr);
        gap: 36px;
      }

      .image-slot {
        width: min(100%, 460px);
      }

      .exchange {
        width: 400px;
      }

      .rate-name {
        font-size: 12px;
      }

      .rate-value {
        font-size: 14px;
      }

      .group-title,
      .section-label {
        font-size: 10px;
      }

      a {
        font-size: 13px;
      }
    }

    @media (max-width: 820px) {
      body {
        display: block;
        padding: 28px 22px 42px;
      }

      .page {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 44px;
      }

      .visual {
        justify-items: center;
      }

      .image-slot {
        width: min(78vw, 390px);
      }

      .visual-note {
        justify-self: center;
      }

      .content {
        gap: 44px;
      }

      .exchange {
        width: min(100%, 420px);
        justify-self: center;
      }

      .links-area {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .links-area {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        row-gap: 30px;
      }

      .image-slot {
        width: min(86vw, 360px);
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="visual" aria-label="Изображение">
      <div class="image-slot" id="image-slot">
        <img src="/home/kuma/Pictures/d9556fa4a75836b1679f1189eb3b7c24.jpg" alt="">
      </div>
      <div class="visual-note">start / home</div>
    </section>

    <section class="content">

     
      <nav class="links-area" aria-label="Быстрые ссылки">

        <section class="link-group">
          <h2 class="group-title">daily</h2>
          <div class="link-list">
            <a href="https://www.google.com/">Google</a>
            <a href="https://mail.google.com/">Gmail</a>
            <a href="https://calendar.google.com/">Calendar</a>
            <a href="https://drive.google.com/">Drive</a>
          </div>
        </section>

        <section class="link-group">
          <h2 class="group-title">work</h2>
          <div class="link-list">
            <a href="https://github.com/">GitHub</a>
            <a href="https://www.notion.so/">Notion</a>
            <a href="https://www.figma.com/">Figma</a>
            <a href="https://www.canva.com/">Canva</a>
          </div>
        </section>

        <section class="link-group">
          <h2 class="group-title">dev</h2>
          <div class="link-list">
            <a href="https://stackoverflow.com/">Stack Overflow</a>
            <a href="https://developer.mozilla.org/">MDN</a>
            <a href="https://news.ycombinator.com/">Hacker News</a>
            <a href="https://chatgpt.com/">ChatGPT</a>
          </div>
        </section>

        <section class="link-group">
          <h2 class="group-title">social</h2>
          <div class="link-list">
            <a href="https://web.telegram.org/">Telegram</a>
            <a href="https://discord.com/app">Discord</a>
            <a href="https://www.reddit.com/">Reddit</a>
            <a href="https://x.com/">X</a>
          </div>
        </section>

        <section class="link-group">
          <h2 class="group-title">media</h2>
          <div class="link-list">
            <a href="https://www.youtube.com/">YouTube</a>
            <a href="https://open.spotify.com/">Spotify</a>
            <a href="https://www.netflix.com/">Netflix</a>
            <a href="https://www.twitch.tv/">Twitch</a>
          </div>
        </section>

        <section class="link-group">
          <h2 class="group-title">other</h2>
          <div class="link-list">
            <a href="https://www.wikipedia.org/">Wikipedia</a>
            <a href="https://www.instagram.com/">Instagram</a>
            <a href="https://www.amazon.com/">Amazon</a>
            <a href="https://www.speedtest.net/">Speedtest</a>
          </div>
        </section>

      </nav>


 <aside class="exchange" aria-label="Курсы валют">
        <h2 class="section-label">exchange</h2>

        <ul class="rates">
          <li>
            <span class="rate-name">RUB / AMD</span>
            <span class="rate-value" id="rub-amd">—</span>
          </li>
          <li>
            <span class="rate-name">RUB / BTC</span>
            <span class="rate-value" id="rub-btc">—</span>
          </li>
        </ul>
      </aside>

    </section>

  </main>

  <script>
    const rubAmdEl = document.getElementById('rub-amd');
    const rubBtcEl = document.getElementById('rub-btc');

    async function updateRates() {
      try {
        const response = await fetch(
          'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/rub.json',
          { cache: 'no-store' }
        );

        if (!response.ok) throw new Error('request failed');

        const data = await response.json();
        const amd = data?.rub?.amd;
        const btc = data?.rub?.btc;

        rubAmdEl.textContent =
          typeof amd === 'number'
            ? `1 RUB = ${amd.toFixed(3)} AMD`
            : '—';

        rubBtcEl.textContent =
          typeof btc === 'number'
            ? `1 RUB = ${btc.toFixed(8)} BTC`
            : '—';

      } catch {
        rubAmdEl.textContent = '—';
        rubBtcEl.textContent = '—';
      }
    }

    updateRates();
    setInterval(updateRates, 30 * 60 * 1000);
  </script>
</body>
</html>
