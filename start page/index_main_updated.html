<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Start</title>

  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --fg: #c7c7c7;
      --soft: #8c8c8c;
      --muted: #5a5a5a;
      --line: #242424;
      --line-strong: #343434;
      --accent: #ffffff;
      --danger: #b08a8f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    html {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: clamp(34px, 5.5vw, 82px);

      display: grid;
      place-items: center;

      font-family:
        "Iosevka Term",
        "Iosevka",
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 15px;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    input,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1240px, calc(100vw - 48px));

      display: grid;
      grid-template-columns:
        minmax(0, 0.92fr)
        minmax(0, 1.08fr);

      gap: clamp(56px, 7vw, 110px);

      align-items: center;
    }

    .visual {
      width: 100%;
      max-width: 470px;
    }

    .image {
      width: 100%;
      aspect-ratio: 4 / 5;

      overflow: hidden;

      background: var(--panel);
      border: 1px solid var(--line);
    }

    .image img {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;

      filter:
        saturate(0.72)
        brightness(0.82)
        contrast(1.02);
    }

    .content {
      min-width: 0;
    }

    .header {
      margin-bottom: 52px;
    }

    .title-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }

    .title {
      margin: 0 0 8px 0;

      color: var(--accent);

      font-size: clamp(27px, 2.8vw, 36px);
      font-weight: 600;

      letter-spacing: 0.04em;
    }

    .edit-button {
      padding: 2px 0;

      color: var(--muted);
      background: transparent;

      border: 0;
      border-bottom: 1px solid transparent;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 0.1em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        color 120ms ease,
        border-color 120ms ease;
    }

    .edit-button:hover,
    .edit-button:focus-visible {
      color: var(--soft);
      border-bottom-color: var(--line-strong);

      outline: none;
    }

    .subtitle {
      min-height: 19px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;

      letter-spacing: 0.04em;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 42px 62px;
    }

    .group {
      min-width: 0;
    }

    .group-title {
      margin: 0 0 16px 0;

      color: var(--muted);

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .group-list {
      display: grid;
      gap: 0;
    }

    .group-list a {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 44px;

      color: var(--soft);

      border-bottom: 1px solid var(--line);

      transition:
        color 120ms ease,
        border-color 120ms ease;
    }

    .group-list a:first-child {
      border-top: 1px solid var(--line);
    }

    .group-list a::after {
      content: "↗";

      margin-left: 20px;

      color: var(--muted);

      opacity: 0;
      transform: translateX(-3px);

      transition:
        opacity 120ms ease,
        transform 120ms ease,
        color 120ms ease;
    }

    .group-list a:hover,
    .group-list a:focus-visible {
      color: var(--accent);
      border-color: var(--line-strong);

      outline: none;
    }

    .group-list a:hover::after,
    .group-list a:focus-visible::after {
      opacity: 1;
      transform: translateX(0);

      color: var(--accent);
    }

    .links-empty {
      color: var(--muted);
      font-size: 12px;
    }

    .exchange {
      margin-top: 52px;
      padding-top: 20px;

      border-top: 1px solid var(--line-strong);
    }

    .exchange-title {
      margin-bottom: 12px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .rates {
      margin: 0;
      padding: 0;

      list-style: none;

      display: grid;
      gap: 12px;
    }

    .rates li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;

      gap: 24px;
    }

    .rate-name {
      color: var(--soft);
    }

    .rate-value {
      color: var(--fg);

      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .rate-value.loading {
      color: var(--muted);
    }

    .footer {
      margin-top: 36px;

      color: var(--muted);

      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .footer span {
      color: var(--soft);
    }

    @media (max-width: 1100px) {
      body {
        padding: clamp(28px, 4vw, 48px);
      }

      .page {
        width: min(100%, 980px);

        grid-template-columns:
          minmax(280px, 0.85fr)
          minmax(400px, 1.15fr);

        gap: clamp(40px, 5vw, 68px);
      }

      .visual {
        max-width: 420px;
      }

      .links {
        gap: 36px 44px;
      }
    }

    @media (max-width: 820px) {
      body {
        display: block;

        padding: 32px 24px 48px;
      }

      .page {
        width: min(100%, 680px);

        margin: 0 auto;

        grid-template-columns: 1fr;
        gap: 48px;
      }

      .visual {
        width: min(100%, 460px);
        max-width: none;

        margin: 0 auto;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 18px 38px;
        font-size: 14px;
      }

      .title {
        font-size: clamp(25px, 8vw, 32px);
      }

      .subtitle {
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 16px 32px;
      }

      .page {
        width: 100%;
        gap: 34px;
      }

      .image {
        aspect-ratio: 4 / 4.7;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }
  </style>
</head>

  <script>
    const STORAGE_KEY =
      "quiet-start-page-links-v3";


    const quotes = [
      "Discipline before comfort.",
      "Do the work.",
      "Stay precise.",
      "No noise. Just progress.",
      "Finish what you start.",
      "Consistency over intensity.",
      "Earn your calm.",
      "Keep moving.",
      "Less talk. More output.",
      "Make it count.",
      "Control the process.",
      "Focus is a decision.",
      "Standards first.",
      "Move with purpose.",
      "Work until it is done."
    ];


    const embeddedLinks =
      JSON.parse(
        document
          .getElementById(
            "links-data"
          )
          .textContent
      );


    function loadWorkingLinks() {
      /*
        Для локального file:// HTML не используем localStorage как
        постоянное хранилище. Источник истины — JSON, встроенный
        непосредственно в этот HTML-файл.
      */
      return embeddedLinks.map(
        item => ({ ...item })
      );
    }


    let links =
      loadWorkingLinks();


    const linksRoot =
      document.getElementById(
        "links"
      );


    document
      .getElementById(
        "quote"
      )
      .textContent =
        quotes[
          Math.floor(
            Math.random()
            * quotes.length
          )
        ];


    function sanitizeLinks(
      items
    ) {
      return items
        .map(
          item => ({
            group:
              String(
                item.group
                || "Links"
              ).trim()
              || "Links",

            name:
              String(
                item.name
                || ""
              ).trim(),

            url:
              String(
                item.url
                || ""
              ).trim()
          })
        )
        .filter(
          item =>
            item.name
            &&
            /^https?:\/\//i.test(
              item.url
            )
        );
    }


    function renderLinks() {
      linksRoot.innerHTML =
        "";


      if (
        !links.length
      ) {
        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "links-empty";

        empty.textContent =
          "No links configured.";

        linksRoot.appendChild(
          empty
        );

        return;
      }


      const groups =
        new Map();


      for (
        const item
        of links
      ) {
        const group =
          item.group
          || "Links";


        if (
          !groups.has(group)
        ) {
          groups.set(
            group,
            []
          );
        }


        groups
          .get(group)
          .push(item);
      }


      for (
        const [
          groupName,
          items
        ]
        of groups
      ) {
        const section =
          document.createElement(
            "section"
          );

        section.className =
          "group";


        const title =
          document.createElement(
            "h2"
          );

        title.className =
          "group-title";

        title.textContent =
          groupName;


        const list =
          document.createElement(
            "div"
          );

        list.className =
          "group-list";


        for (
          const item
          of items
        ) {
          const link =
            document.createElement(
              "a"
            );

          link.href =
            item.url;

          link.target =
            "_blank";

          link.rel =
            "noopener noreferrer";

          link.textContent =
            item.name;


          list.appendChild(
            link
          );
        }


        section.append(
          title,
          list
        );


        linksRoot.appendChild(
          section
        );
      }
    }


    function saveWorkingCopy() {
      /*
        Намеренно ничего не пишем в localStorage.
        Ссылки сохраняются внутрь скачиваемой копии HTML.
      */
    }


    function buildUpdatedHtml() {
      const dataNode =
        document.getElementById(
          "links-data"
        );


      dataNode.textContent =
        "\n"
        + JSON.stringify(
            links,
            null,
            2
          )
        + "\n  ";


      return (
        "<!doctype html>\n"
        + document
            .documentElement
            .outerHTML
      );
    }


    async function saveHtmlFile() {
      const source =
        buildUpdatedHtml();


      /*
        Firefox не позволяет обычной file:// странице надёжно
        перезаписать саму себя. Поэтому всегда скачиваем новую копию.
        Она уже содержит текущий список ссылок внутри links-data.
      */
      const blob =
        new Blob(
          [source],
          {
            type:
              "text/html;charset=utf-8"
          }
        );


      const objectUrl =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        objectUrl;

      a.download =
        "index_main_updated.html";


      document.body
        .appendChild(a);


      a.click();
      a.remove();


      setTimeout(
        () =>
          URL.revokeObjectURL(
            objectUrl
          ),
        1000
      );


      return {
        mode:
          "download"
      };
    }



    async function applyLinksFromEditor(
      items
    ) {
      /*
        Ключевое исправление:
        сначала применяем и рисуем ссылки на основной странице,
        только после этого сохраняем HTML.
      */

      links =
        sanitizeLinks(
          items
        );


      saveWorkingCopy();


      renderLinks();


      return await saveHtmlFile();
    }


    window.applyLinksFromEditor =
      applyLinksFromEditor;


    window.getLinksForEditor =
      () =>
        links.map(
          item => ({
            ...item
          })
        );

          "popup=yes,width=860,height=760,resizable=yes,scrollbars=yes"
        );


      if (!popup) {
        return;
      }


      popup.document.open();


      popup.document.write(
        `<!doctype html>

  <script>
    const rows =
      document.getElementById(
        "editor-rows"
      );

    const status =
      document.getElementById(
        "editor-status"
      );


    function makeRow(
      item = {}
    ) {
      const row =
        document.createElement(
          "div"
        );

      row.className =
        "row";


      const group =
        document.createElement(
          "input"
        );

      group.type =
        "text";

      group.placeholder =
        "Group";

      group.value =
        item.group || "";

      group.dataset.field =
        "group";


      const name =
        document.createElement(
          "input"
        );

      name.type =
        "text";

      name.placeholder =
        "Name";

      name.value =
        item.name || "";

      name.dataset.field =
        "name";


      const url =
        document.createElement(
          "input"
        );

      url.type =
        "url";

      url.placeholder =
        "https://...";

      url.value =
        item.url || "";

      url.dataset.field =
        "url";


      const remove =
        document.createElement(
          "button"
        );

      remove.type =
        "button";

      remove.className =
        "remove";

      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () =>
          row.remove()
      );


      row.append(
        group,
        name,
        url,
        remove
      );


      return row;
    }


    function collect() {
      return [
        ...rows
          .querySelectorAll(
            ".row"
          )
      ]
        .map(
          row => {
            const item =
              {};


            for (
              const input

                )
            ) {
              item[
                input.dataset.field
              ] =
                input.value.trim();
            }


            return item;
          }
        )
        .filter(
          item =>
            item.name
            &&
            item.url
        );
    }


    function load() {
      rows.innerHTML =
        "";


      const items =
        window.opener
          .getLinksForEditor();


      for (
        const item
        of items
      ) {
        rows.appendChild(
          makeRow(
            item
          )
        );
      }
    }


    document
      .getElementById(
        "editor-add"
      )
      .addEventListener(
        "click",
        () => {
          const row =
            makeRow(
              {
                group:
                  "Daily",

                name:
                  "",

                url:
                  ""
              }
            );


          rows.appendChild(
            row
          );


          row
            .querySelector(
              '[data-field="name"]'
            )
            .focus();
        }
      );


    document
      .getElementById(
        "editor-close"
      )
      .addEventListener(
        "click",
        () =>
          window.close()
      );


    document
      .getElementById(
        "editor-save"
      )
      .addEventListener(
        "click",
        async () => {
          status.textContent =
            "Saving...";


          try {
            const result =
              await window.opener
                .applyLinksFromEditor(
                  collect()
                );


            if (
              result.mode
                === "download"
            ) {
              status.textContent =
                "Saved. Replace the old start-page file with index_main_updated.html.";
            }
          }

          catch (
            error
          ) {
            status.textContent =
              error.message
              || "Could not save.";
          }
        }
      );


    load();
  <\/script>

</body>
</html>`
      );


      popup.document.close();
    }


    document
      .getElementById(
        "edit-links"
      )
      .addEventListener(
        "click",
        openEditor
      );


    const rubAmd =
      document.getElementById(
        "rub-amd"
      );

    const rubBtc =
      document.getElementById(
        "rub-btc"
      );


    function setRate(
      element,
      value
    ) {
      element.textContent =
        value;

      element.classList.remove(
        "loading"
      );
    }


    async function updateRates() {
      rubAmd.textContent =
        "...";

      rubBtc.textContent =
        "...";

      rubAmd.classList.add(
        "loading"
      );

      rubBtc.classList.add(
        "loading"
      );


      try {
        const response =
          await fetch(
            "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/rub.json",
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {
          throw new Error(
            "request failed"
          );
        }


        const data =
          await response.json();


        const amd =
          data?.rub?.amd;

        const btc =
          data?.rub?.btc;


        setRate(
          rubAmd,

          typeof amd
            === "number"

            ? `1 RUB = ${amd.toFixed(3)} AMD`

            : "—"
        );


        setRate(
          rubBtc,

          typeof btc
            === "number"

            ? `1 RUB = ${btc.toFixed(8)} BTC`

            : "—"
        );
      }

      catch {
        setRate(
          rubAmd,
          "—"
        );

        setRate(
          rubBtc,
          "—"
        );
      }
    }


    renderLinks();
    updateRates();


    setInterval(
      updateRates,
      30 * 60 * 1000
    );
  </script>



</body></html>
