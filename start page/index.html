<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Start</title>

  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --fg: #c7c7c7;
      --soft: #8c8c8c;
      --muted: #5a5a5a;
      --line: #242424;
      --line-strong: #343434;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    html {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: clamp(34px, 5.5vw, 82px);

      display: grid;
      place-items: center;

      font-family:
        "Iosevka Term",
        "Iosevka",
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 15px;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1240px, calc(100vw - 48px));

      display: grid;
      grid-template-columns:
        minmax(0, 0.92fr)
        minmax(0, 1.08fr);

      gap: clamp(56px, 7vw, 110px);

      align-items: center;
    }

    .visual {
      width: 100%;
      max-width: 470px;
    }

    .image {
      width: 100%;
      aspect-ratio: 4 / 5;

      overflow: hidden;

      background: var(--panel);
      border: 1px solid var(--line);
    }

    .image img {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;

      filter:
        saturate(0.72)
        brightness(0.82)
        contrast(1.02);
    }

    .content {
      min-width: 0;
    }

    .header {
      margin-bottom: 52px;
    }

    .title-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }

    .title {
      margin: 0 0 8px 0;

      color: var(--accent);

      font-size: clamp(27px, 2.8vw, 36px);
      font-weight: 600;

      letter-spacing: 0.04em;
    }

    .subtitle {
      min-height: 44px;
      display: grid;
      gap: 5px;
    }

    .quote-jp {
      color: var(--soft);
      font-size: 14px;
      line-height: 1.9;
      letter-spacing: 0.08em;
      font-family:
        "Noto Serif JP",
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "MS Mincho",
        serif;
      font-weight: 500;
    }

    .quote-ru {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      font-family:
        "Iosevka Term",
        "Iosevka",
        "JetBrains Mono",
        monospace;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 42px 62px;
    }

    .group {
      min-width: 0;
    }

    .group-title {
      margin: 0 0 16px 0;

      color: var(--muted);

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .group-list {
      display: grid;
      gap: 0;
    }

    .group-list a {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 44px;

      color: var(--soft);

      border-bottom: 1px solid var(--line);

      transition:
        color 120ms ease,
        border-color 120ms ease;
    }

    .group-list a:first-child {
      border-top: 1px solid var(--line);
    }

    .group-list a::after {
      content: "↗";

      margin-left: 20px;

      color: var(--muted);

      opacity: 0;
      transform: translateX(-3px);

      transition:
        opacity 120ms ease,
        transform 120ms ease,
        color 120ms ease;
    }

    .group-list a:hover,
    .group-list a:focus-visible {
      color: var(--accent);
      border-color: var(--line-strong);

      outline: none;
    }

    .group-list a:hover::after,
    .group-list a:focus-visible::after {
      opacity: 1;
      transform: translateX(0);

      color: var(--accent);
    }

    .exchange {
      margin-top: 52px;
      padding-top: 20px;

      border-top: 1px solid var(--line-strong);
    }

    .exchange-title {
      margin-bottom: 12px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .rates {
      margin: 0;
      padding: 0;

      list-style: none;

      display: grid;
      gap: 12px;
    }

    .rates li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;

      gap: 24px;
    }

    .rate-name {
      color: var(--soft);
    }

    .rate-value {
      color: var(--fg);

      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .rate-value.loading {
      color: var(--muted);
    }

    .footer {
      margin-top: 36px;

      color: var(--muted);

      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .footer span {
      color: var(--soft);
    }

    /* Медленное, мягкое появление страницы */
    @keyframes reveal-title {
      0% {
        opacity: 0;
        transform: translateY(22px);
        filter: blur(5px);
      }
      55% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes reveal-group-title {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes reveal-link {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes reveal-image {
      0% {
        opacity: 0;
        transform: scale(1.065) translateY(10px);
        clip-path: inset(10% 0 90% 0);
      }
      45% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes reveal-frame {
      from {
        opacity: 0;
        transform: translateY(14px);
        border-color: transparent;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        border-color: var(--line);
      }
    }

    @keyframes reveal-soft {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .image {
      animation: reveal-frame 1500ms cubic-bezier(.16,1,.3,1) 120ms both;
    }

    .image img {
      animation: reveal-image 1850ms cubic-bezier(.16,1,.3,1) 170ms both;
      will-change: transform, opacity, clip-path;
    }

    .header {
      animation: reveal-title 1400ms cubic-bezier(.16,1,.3,1) 420ms both;
    }

    .links .group {
      --group-delay: 760ms;
    }

    .links .group:nth-child(2) { --group-delay: 920ms; }
    .links .group:nth-child(3) { --group-delay: 1080ms; }
    .links .group:nth-child(4) { --group-delay: 1240ms; }
    .links .group:nth-child(n+5) { --group-delay: 1400ms; }

    .links .group-title {
      animation: reveal-group-title 1050ms cubic-bezier(.16,1,.3,1) var(--group-delay) both;
    }

    .links .group-list a {
      --item-delay: 110ms;
      animation: reveal-link 1150ms cubic-bezier(.16,1,.3,1)
        calc(var(--group-delay) + var(--item-delay)) both;
    }

    .links .group-list a:nth-child(2) { --item-delay: 220ms; }
    .links .group-list a:nth-child(3) { --item-delay: 330ms; }
    .links .group-list a:nth-child(4) { --item-delay: 440ms; }
    .links .group-list a:nth-child(5) { --item-delay: 550ms; }
    .links .group-list a:nth-child(6) { --item-delay: 660ms; }
    .links .group-list a:nth-child(n+7) { --item-delay: 770ms; }

    .exchange {
      animation: reveal-soft 1250ms cubic-bezier(.16,1,.3,1) 1580ms both;
    }

    .footer {
      animation: reveal-soft 1250ms cubic-bezier(.16,1,.3,1) 1740ms both;
    }

    @media (prefers-reduced-motion: reduce) {
      .image,
      .image img,
      .header,
      .links .group-title,
      .links .group-list a,
      .exchange,
      .footer {
        animation: none;
        filter: none;
        clip-path: none;
      }
    }

    @media (max-width: 1100px) {
      body {
        padding: clamp(28px, 4vw, 48px);
      }

      .page {
        width: min(100%, 980px);

        grid-template-columns:
          minmax(280px, 0.85fr)
          minmax(400px, 1.15fr);

        gap: clamp(40px, 5vw, 68px);
      }

      .visual {
        max-width: 420px;
      }

      .links {
        gap: 36px 44px;
      }
    }

    @media (max-width: 820px) {
      body {
        display: block;

        padding: 32px 24px 48px;
      }

      .page {
        width: min(100%, 680px);

        margin: 0 auto;

        grid-template-columns: 1fr;
        gap: 48px;
      }

      .visual {
        width: min(100%, 460px);
        max-width: none;

        margin: 0 auto;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 18px 38px;
        font-size: 14px;
      }

      .title {
        font-size: clamp(25px, 8vw, 32px);
      }

      .subtitle {
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 16px 32px;
      }

      .page {
        width: 100%;
        gap: 34px;
      }

      .image {
        aspect-ratio: 4 / 4.7;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="visual">
      <div class="image">
        <img
          src="/home/kuma/Pictures/d9556fa4a75836b1679f1189eb3b7c24.jpg"
          alt=""
        />
      </div>
    </section>


    <section class="content">

      <header class="header">

        <div class="title-line">

          <h1 class="title">
            起点
          </h1>

        </div>


        <div
          class="subtitle"
          id="quote"
        >
          <span class="quote-jp">規律は安逸に先立つ。</span>
          <span class="quote-ru">Дисциплина прежде комфорта.</span>
        </div>

      </header>

      <!--
        Быстрые ссылки: редактируй этот блок вручную.
        Чтобы добавить ссылку, скопируй строку <a ...>...</a>.
        Чтобы добавить группу, скопируй целый <section class="group">...</section>.
      -->
      <nav
        class="links"
        aria-label="Быстрые ссылки"
      >
        <section class="group">
          <h2 class="group-title">Daily</h2>
          <div class="group-list">
            <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT</a>
            <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">Gmail</a>
            <a href="https://protonmail.com" target="_blank" rel="noopener noreferrer">ProtonMail</a>

          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Dev</h2>
          <div class="group-list">
            <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://my.hip.hosting/login?redirectTo=%2Fhiplets%2F88477" target="_blank" rel="noopener noreferrer">Hip.Hosting</a>
            <a href="https://hostkey.com/login/" target="_blank" rel="noopener noreferrer">KeyHost</a>
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Media</h2>
          <div class="group-list">
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="https://shikimori.io/" target="_blank" rel="noopener noreferrer">Shikimori</a>

            <a href="https://soundcloud.com/" target="_blank" rel="noopener noreferrer">SoundCloud</a>
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Social</h2>
          <div class="group-list">
            <a href="https://web.telegram.org/" target="_blank" rel="noopener noreferrer">Telegram</a>
            <a href="https://www.reddit.com/" target="_blank" rel="noopener noreferrer">Reddit</a>
            <a href="https://www.pinterest.com/" target="_blank" rel="noopener noreferrer">Pinterest</a>
            <a href="https://www.tumblr.com/" target="_blank" rel="noopener noreferrer">Tumblr</a>
          </div>
        </section>
      </nav>


      <aside class="exchange">

        <div class="exchange-title">
          Exchange
        </div>

        <ul class="rates">

          <li>
            <span class="rate-name">
              RUB / AMD
            </span>

            <span
              class="rate-value loading"
              id="rub-amd"
            >
              loading
            </span>
          </li>

          <li>
            <span class="rate-name">
              RUB / BTC
            </span>

            <span
              class="rate-value loading"
              id="rub-btc"
            >
              loading
            </span>
          </li>

        </ul>

      </aside>


      <div class="footer">
      </div>

    </section>

  </main>


  <script>
    const quotes = [
      { jp: "規律は安逸に先立つ。", ru: "Дисциплина прежде комфорта." },
      { jp: "静かに進め。結果で語れ。", ru: "Двигайся тихо. Пусть результат говорит за тебя." },
      { jp: "為すべきを、ただ為せ。", ru: "Просто делай то, что должен." },
      { jp: "迷いを捨て、歩みを正せ。", ru: "Отбрось сомнения. Иди верным путём." },
      { jp: "始めたことは、最後まで貫け。", ru: "Начал — доведи до конца." },
      { jp: "激しさより、積み重ねを尊べ。", ru: "Цени постоянство выше порыва." },
      { jp: "平静は、鍛錬ののちに訪れる。", ru: "Спокойствие приходит после дисциплины." },
      { jp: "一歩一歩、怠るな。", ru: "Шаг за шагом. Не расслабляйся." },
      { jp: "多く語るな。形にせよ。", ru: "Меньше слов. Воплоти в деле." },
      { jp: "今日を、疎かにするな。", ru: "Не растрачивай сегодняшний день." },
      { jp: "過程を整えよ。結果は後に続く。", ru: "Выстрой процесс. Результат последует." },
      { jp: "集中は、覚悟のかたちである。", ru: "Сосредоточенность — форма решимости." },
      { jp: "基準を下げるな。", ru: "Не снижай планку." },
      { jp: "目的を見失わずに進め。", ru: "Иди вперёд, не теряя цели." },
      { jp: "成し遂げるまで、手を止めるな。", ru: "Не останавливайся, пока не завершишь." }
    ];

    const quote = quotes[Math.floor(Math.random() * quotes.length)];

    document.querySelector("#quote .quote-jp").textContent = quote.jp;
    document.querySelector("#quote .quote-ru").textContent = quote.ru;


    const rubAmd =
      document.getElementById(
        "rub-amd"
      );

    const rubBtc =
      document.getElementById(
        "rub-btc"
      );


    function setRate(
      element,
      value
    ) {
      element.textContent =
        value;

      element.classList.remove(
        "loading"
      );
    }


    async function updateRates() {
      rubAmd.textContent =
        "...";

      rubBtc.textContent =
        "...";

      rubAmd.classList.add(
        "loading"
      );

      rubBtc.classList.add(
        "loading"
      );


      try {
        const response =
          await fetch(
            "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/rub.json",
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {
          throw new Error(
            "request failed"
          );
        }


        const data =
          await response.json();


        const amd =
          data?.rub?.amd;

        const btc =
          data?.rub?.btc;


        setRate(
          rubAmd,

          typeof amd
            === "number"

            ? `1 RUB = ${amd.toFixed(3)} AMD`

            : "—"
        );


        setRate(
          rubBtc,

          typeof btc
            === "number"

            ? `1 RUB = ${btc.toFixed(8)} BTC`

            : "—"
        );
      }

      catch {
        setRate(
          rubAmd,
          "—"
        );

        setRate(
          rubBtc,
          "—"
        );
      }
    }
    updateRates();


    setInterval(
      updateRates,
      30 * 60 * 1000
    );
  </script>

</body>
</html>
