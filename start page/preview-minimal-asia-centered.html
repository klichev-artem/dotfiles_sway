<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="dark" name="color-scheme"/>
<meta content="#050707" name="theme-color"/>
<title>~$hello!</title>
<style>
:root {
  color-scheme: dark;

  --bg: #090a09;
  --bg-2: #0d0f0e;
  --panel: #111412;
  --panel-2: #151917;

  --line: #242a27;
  --line-soft: #1a1f1d;

  --text: #e8e6df;
  --soft: #b8b6ae;
  --muted: #777a73;
  --faint: #494d48;

  --jade: #9db8a3;
  --jade-dim: #607566;

  --vermillion: #c6533f;
  --vermillion-soft: #e1745e;

  --paper: #d9d3c6;
  --inverse-text: #111310;

  --mono: "Iosevka Term", "JetBrains Mono", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
}

html {
  background:
    linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.009) 1px, transparent 1px),
    var(--bg);
  background-size: 36px 36px;
}

body {
  min-height: 100dvh;
  padding: 24px 24px 60px;
  position: relative;
  overflow-x: hidden;

  display: grid;
  place-items: center;
}

/* faint shoji / rice-paper atmosphere */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 0%, rgba(157,184,163,.045), transparent 34%),
    linear-gradient(to bottom, rgba(255,255,255,.012), transparent 24%);
  opacity: .8;
  z-index: 0;
}

/* small hanko-like seal */
body::after {
  content: "静";
  position: fixed;
  right: 24px;
  top: 22px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;

  color: var(--vermillion-soft);
  border: 1px solid rgba(198,83,63,.65);
  font-family: "Noto Serif CJK JP", "Noto Serif JP", serif;
  font-size: 15px;
  line-height: 1;

  opacity: .72;
  transform: rotate(-2deg);
  pointer-events: none;
  z-index: 20;
}

button,
input,
select {
  font: inherit;
}

button {
  color: inherit;
}

.shell {
  position: relative;
  z-index: 1;

  width: min(880px, 100%);
  margin: 0 auto;

  display: grid;
  gap: 30px;
}

/* =========================================================
   VISUAL
   ========================================================= */

.visual {
  width: 100%;
  display: grid;
  justify-items: center;
  gap: 10px;
}

.tui-frame {
  width: min(500px, 100%);
  position: relative;
}

/* asymmetrical Japanese editorial line */
.tui-frame::before {
  content: "";
  position: absolute;
  left: -15px;
  top: 14%;
  bottom: 14%;
  width: 1px;
  background: linear-gradient(
    to bottom,
    transparent,
    var(--jade-dim) 20%,
    var(--jade-dim) 80%,
    transparent
  );
  opacity: .7;
}

.tui-frame::after {
  content: "余白";
  position: absolute;
  left: -29px;
  top: 50%;
  transform: translateY(-50%);
  writing-mode: vertical-rl;
  text-orientation: upright;

  color: var(--faint);
  font-family: "Noto Serif CJK JP", "Noto Serif JP", serif;
  font-size: 9px;
  letter-spacing: .18em;
  opacity: .7;
}

.tui-top,
.tui-bottom {
  display: none;
}

.image-wrap {
  padding: 0;
  margin: 0;
  border: 0;
  position: relative;
}

.image-wrap img {
  display: block;
  width: 100%;
  max-height: 260px;

  object-fit: cover;
  object-position: center;

  filter:
    grayscale(1)
    sepia(.07)
    contrast(1.05)
    brightness(.83);

  opacity: .94;
}

/* very thin picture edge */
.image-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(217,211,198,.08);
  pointer-events: none;
}

.quiet-note {
  width: min(500px, 100%);
  margin: 0;
  padding: 0 8px;
  text-align: center;
  user-select: none;
  pointer-events: none;
}

.quiet-note p {
  margin: 0;

  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  letter-spacing: .01em;

  opacity: .78;
  transition: opacity .35s ease;
}

.quiet-note p::before {
  content: "「";
  color: var(--vermillion);
  opacity: .72;
}

.quiet-note p::after {
  content: "」";
  color: var(--vermillion);
  opacity: .72;
}

.quiet-note p.is-changing {
  opacity: .18;
}

/* =========================================================
   LINKS
   ========================================================= */

.links-grid {
  width: 100%;

  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));

  gap: 34px;
  align-items: start;

  padding-top: 4px;
}

.group {
  min-width: 0;
  position: relative;
  padding-top: 11px;
}

.group::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;

  width: 28px;
  height: 1px;

  background: var(--vermillion);
  opacity: .78;
}

.group h2 {
  margin: 0 0 13px;

  color: var(--paper);

  font-size: 14px;
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: .01em;
}

/* secondary Japanese labels */
.group:nth-child(1) h2::after {
  content: "  開発";
}

.group:nth-child(2) h2::after {
  content: "  道具";
}

.group:nth-child(3) h2::after {
  content: "  その他";
}

.group h2::after {
  color: var(--jade-dim);

  font-family: "Noto Serif CJK JP", "Noto Serif JP", serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .12em;

  opacity: .76;
}

.group ul {
  list-style: none;
  margin: 0;
  padding: 0;

  display: grid;
  gap: 2px;
}

.group li {
  min-width: 0;
}

.group a {
  width: fit-content;
  max-width: 100%;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 5px 7px 5px 0;

  color: var(--soft);

  font-size: 14px;
  line-height: 1.35;
  text-decoration: none;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  transition:
    color .12s ease,
    background-color .12s ease,
    padding .12s ease;
}

.group a::before {
  content: "›";
  color: var(--jade-dim);
  flex: 0 0 auto;
}

.group a:hover,
.group a:focus-visible {
  color: var(--inverse-text);
  background: var(--paper);

  padding-left: 7px;

  outline: none;
}

.group a:hover::before,
.group a:focus-visible::before {
  color: var(--vermillion);
}

/* =========================================================
   CONTROLS
   ========================================================= */

.page-controls {
  display: flex;
  justify-content: center;
}

.page-controls button {
  appearance: none;

  border: 0;
  border-bottom: 1px solid transparent;

  padding: 4px 2px;

  background: transparent;
  color: var(--faint);

  font-size: 11px;

  cursor: pointer;
}

.page-controls button::before {
  content: "編 ";
  color: var(--vermillion);
  opacity: .65;

  font-family: "Noto Serif CJK JP", "Noto Serif JP", serif;
  font-size: 9px;
}

.page-controls button:hover,
.page-controls button:focus-visible {
  color: var(--soft);
  border-bottom-color: var(--line);

  outline: none;
}

/* =========================================================
   FOOTER
   ========================================================= */

.ambient-footer {
  position: fixed;
  z-index: 10;

  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);

  width: min(880px, calc(100% - 48px));

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;

  color: var(--faint);

  font-size: 11px;
  line-height: 1.3;
}

.ambient-footer::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -8px;

  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(157,184,163,.18) 18%,
      rgba(157,184,163,.18) 82%,
      transparent
    );
}

.weather-readout,
.city-form button {
  appearance: none;

  border: 0;
  padding: 0;

  background: transparent;
  color: inherit;

  cursor: pointer;
}

.weather-readout:hover,
.weather-readout:focus-visible,
.city-form button:hover,
.city-form button:focus-visible {
  color: var(--soft);
  outline: none;
}

.weather-readout span + span::before {
  content: " ・ ";
  color: var(--vermillion);
  opacity: .52;
}

.city-form {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.city-form[hidden] {
  display: none;
}

.city-form input {
  width: 120px;
  min-width: 0;

  padding: 2px 0;

  border: 0;
  border-bottom: 1px solid var(--line);

  outline: 0;

  background: transparent;
  color: var(--soft);
}

.city-form input:focus {
  border-bottom-color: var(--jade-dim);
}

.ambient-right {
  white-space: nowrap;
}

/* =========================================================
   EDITOR
   ========================================================= */

.link-editor {
  width: min(760px, calc(100% - 32px));
  max-height: min(660px, calc(100dvh - 40px));

  padding: 0;

  border: 1px solid var(--line);
  background: rgba(9,10,9,.98);
  color: var(--text);
}

.link-editor::backdrop {
  background: rgba(0,0,0,.78);
}

.editor-shell {
  padding: 16px;

  display: grid;
  gap: 14px;
}

.editor-top,
.editor-foot {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;

  gap: 12px;

  color: var(--muted);

  font-size: 11px;
}

.editor-top {
  padding-bottom: 11px;
  border-bottom: 1px solid var(--line);
}

.editor-top::before {
  content: "編集";
  color: var(--vermillion);

  font-family: "Noto Serif CJK JP", "Noto Serif JP", serif;
  font-size: 9px;
  letter-spacing: .15em;
}

.editor-top strong {
  color: var(--paper);
  font-weight: 600;
}

/* keep original modules, only restyle */
.editor-top button,
.editor-foot button,
.add-form button,
.editor-row button {
  appearance: none;

  border: 0;

  background: transparent;
  color: var(--muted);

  cursor: pointer;

  padding: 3px 5px;
}

.editor-top button:hover,
.editor-foot button:hover,
.add-form button:hover,
.editor-row button:hover {
  color: var(--paper);
}

.editor-groups {
  max-height: 410px;
  overflow: auto;

  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));

  gap: 18px;

  scrollbar-width: thin;
  scrollbar-color: var(--line) var(--bg);
}

.editor-group {
  min-width: 0;
}

.editor-group h3 {
  margin: 0 0 8px;

  color: var(--jade);

  font-size: 12px;
  font-weight: 600;
}

.editor-list {
  min-height: 34px;

  list-style: none;
  margin: 0;
  padding: 0;

  border-top: 1px solid var(--line);
}

.editor-list.drag-over {
  border-top-color: var(--vermillion);
}

.editor-row {
  min-width: 0;

  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  align-items: center;

  gap: 6px;

  padding: 7px 0;

  border-bottom: 1px solid var(--line-soft);

  color: var(--soft);

  font-size: 11px;

  cursor: grab;
}

.editor-row.dragging {
  opacity: .3;
}

.editor-row-main {
  min-width: 0;
}

.editor-row-label,
.editor-row-url {
  display: block;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.editor-row-url {
  margin-top: 2px;

  color: var(--faint);

  font-size: 9px;
}

.editor-row-actions {
  display: flex;
  gap: 1px;
}

.editor-row-actions button {
  font-size: 10px;
}

.add-form {
  padding-top: 14px;

  border-top: 1px solid var(--line);

  display: grid;
  grid-template-columns: 130px 1fr 1.55fr auto;

  gap: 8px;
}

.add-form input,
.add-form select {
  min-width: 0;

  padding: 7px 8px;

  border: 1px solid var(--line);

  outline: 0;

  background: var(--panel);
  color: var(--soft);

  font-size: 11px;
}

.add-form input:focus,
.add-form select:focus {
  border-color: var(--jade-dim);
}

.add-form button {
  border: 1px solid var(--line);
  padding: 7px 10px;
}

.add-form button:hover {
  border-color: var(--vermillion);
}

/* legacy quote module preserved, visually hidden as before */
.tui-quote,
.tui-quote-line,
.quote-meta,
.quote-prefix,
.quote-cursor {
  display: none !important;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */


@media (max-height: 760px) and (min-width: 761px) {
  body {
    place-items: start center;
    padding-top: 28px;
  }
}

@media (max-width: 760px) {
  body {
    display: block;
    padding: 30px 18px 64px;
  }

  body::after {
    right: 16px;
    top: 16px;
  }

  .shell {
    gap: 26px;
  }

  .links-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px 32px;
  }

  .editor-groups {
    grid-template-columns: 1fr 1fr;
  }

  .add-form {
    grid-template-columns: 1fr;
  }

  .ambient-footer {
    width: calc(100% - 36px);
  }

  .tui-frame::before,
  .tui-frame::after {
    display: none;
  }
}

@media (max-width: 520px) {
  .links-grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .group a {
    font-size: 15px;
  }

  .editor-groups {
    grid-template-columns: 1fr;
  }

  .ambient-footer {
    align-items: flex-end;
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>

  let groups = loadGroups();
  let dragSource = null;

  function cloneDefaults() {
    return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
  }

  function loadGroups() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return cloneDefaults();
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || !parsed.length) return cloneDefaults();
      return parsed;
    } catch (_) {
      return cloneDefaults();
    }
  }

  function saveGroups() {
    localStorage.setItem(STORE_KEY, JSON.stringify(groups));
  }

  function escapeText(value) {
    return String(value ?? "");
  }

  function renderLinks() {
    grid.textContent = "";
    grid.style.setProperty("--cols", String(Math.min(3, Math.max(1, groups.length))));

    groups.forEach(group => {
      const section = document.createElement("section");
      section.className = "group";

      const title = document.createElement("h2");
      title.textContent = group.title;
      section.append(title);

      const list = document.createElement("ul");
      group.items.forEach(item => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = item.label;
        li.append(a);
        list.append(li);
      });

      section.append(list);
      grid.append(section);
    });
  }

  function refreshGroupSelect() {
    addGroup.textContent = "";
    groups.forEach((group, i) => {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = group.title;
      addGroup.append(option);
    });
  }

  function moveItem(fromGroup, fromIndex, toGroup, toIndex) {
    if (
      !groups[fromGroup] ||
      !groups[toGroup] ||
      !groups[fromGroup].items[fromIndex]
    ) return;

    const [item] = groups[fromGroup].items.splice(fromIndex, 1);

    let targetIndex = toIndex;
    if (fromGroup === toGroup && fromIndex < toIndex) {
      targetIndex -= 1;
    }

    targetIndex = Math.max(0, Math.min(targetIndex, groups[toGroup].items.length));
    groups[toGroup].items.splice(targetIndex, 0, item);

    saveGroups();
    renderLinks();
    renderEditor();
  }

  function renderEditor() {
    editorGroups.textContent = "";

    groups.forEach((group, groupIndex) => {
      const section = document.createElement("section");
      section.className = "editor-group";

      const title = document.createElement("h3");
      title.textContent = group.title;
      section.append(title);

      const list = document.createElement("ul");
      list.className = "editor-list";
      list.dataset.group = String(groupIndex);

      list.addEventListener("dragover", (event) => {
        event.preventDefault();
        list.classList.add("drag-over");
      });

      list.addEventListener("dragleave", () => list.classList.remove("drag-over"));

      list.addEventListener("drop", (event) => {
        event.preventDefault();
        list.classList.remove("drag-over");
        if (!dragSource) return;

        const row = event.target.closest(".editor-row");
        const targetIndex = row ? Number(row.dataset.index) : group.items.length;
        moveItem(dragSource.group, dragSource.index, groupIndex, targetIndex);
        dragSource = null;
      });

      group.items.forEach((item, itemIndex) => {
        const row = document.createElement("li");
        row.className = "editor-row";
        row.draggable = true;
        row.dataset.group = String(groupIndex);
        row.dataset.index = String(itemIndex);

        const main = document.createElement("div");
        main.className = "editor-row-main";

        const label = document.createElement("span");
        label.className = "editor-row-label";
        label.textContent = escapeText(item.label);

        const url = document.createElement("span");
        url.className = "editor-row-url";
        url.textContent = escapeText(item.url);

        main.append(label, url);

        const actions = document.createElement("div");
        actions.className = "editor-row-actions";

        const up = document.createElement("button");
        up.type = "button";
        up.textContent = "↑";
        up.title = "Move up";
        up.disabled = itemIndex === 0;
        up.addEventListener("click", () => {
          if (itemIndex > 0) moveItem(groupIndex, itemIndex, groupIndex, itemIndex - 1);
        });

        const down = document.createElement("button");
        down.type = "button";
        down.textContent = "↓";
        down.title = "Move down";
        down.disabled = itemIndex === group.items.length - 1;
        down.addEventListener("click", () => {
          if (itemIndex < group.items.length - 1) moveItem(groupIndex, itemIndex, groupIndex, itemIndex + 2);
        });

        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "×";
        del.title = "Delete";
        del.addEventListener("click", () => {
          groups[groupIndex].items.splice(itemIndex, 1);
          saveGroups();
          renderLinks();
          renderEditor();
        });

        actions.append(up, down, del);
        row.append(main, actions);

        row.addEventListener("dragstart", () => {
          dragSource = { group: groupIndex, index: itemIndex };
          row.classList.add("dragging");
        });

        row.addEventListener("dragend", () => {
          row.classList.remove("dragging");
          dragSource = null;
          $$(".editor-list").forEach(el => el.classList.remove("drag-over"));
        });

        list.append(row);
      });

      section.append(list);
      editorGroups.append(section);
    });

    refreshGroupSelect();
  }

  editButton.addEventListener("click", () => {
    renderEditor();
    if (typeof editor.showModal === "function") editor.showModal();
    else editor.setAttribute("open", "");
  });

  editorClose.addEventListener("click", () => editor.close());

  editor.addEventListener("click", (event) => {
    if (event.target === editor) editor.close();
  });

  addForm.addEventListener("submit", (event) => {
    event.preventDefault();

    const groupIndex = Number(addGroup.value);
    const label = addLabel.value.trim();
    const url = addUrl.value.trim();

    if (!groups[groupIndex] || !label || !url) return;

    let normalizedUrl = url;
    try {
      normalizedUrl = new URL(url).href;
    } catch (_) {
      addUrl.setCustomValidity("Enter a full URL, e.g. https://example.com");
      addUrl.reportValidity();
      return;
    }

    addUrl.setCustomValidity("");
    groups[groupIndex].items.push({ label, url: normalizedUrl });
    saveGroups();
    renderLinks();
    renderEditor();

    addLabel.value = "";
    addUrl.value = "";
    addLabel.focus();
  });

  resetButton.addEventListener("click", () => {
    groups = cloneDefaults();
    saveGroups();
    renderLinks();
    renderEditor();
  });

  document.addEventListener("keydown", (event) => {
    if (
      event.key.toLowerCase() === "e" &&
      !editor.open &&
      !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName || "")
    ) {
      event.preventDefault();
      editButton.click();
    }
  });

  // WEATHER — Open-Meteo geocoding + current conditions
  function weatherLabel(code) {
    const c = Number(code);
    if (c === 0) return "clear";
    if ([1,2].includes(c)) return "partly cloudy";
    if (c === 3) return "cloudy";
    if ([45,48].includes(c)) return "fog";
    if ([51,53,55,56,57].includes(c)) return "drizzle";
    if ([61,63,65,66,67,80,81,82].includes(c)) return "rain";
    if ([71,73,75,77,85,86].includes(c)) return "snow";
    if ([95,96,99].includes(c)) return "storm";
    return "weather";
  }

  async function resolveCity(name) {
    const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
    url.searchParams.set("name", name);
    url.searchParams.set("count", "1");
    url.searchParams.set("language", "en");
    url.searchParams.set("format", "json");

    const response = await fetch(url, { cache:"no-store" });
    if (!response.ok) throw new Error("geocoding failed");

    const data = await response.json();
    const place = data?.results?.[0];
    if (!place) throw new Error("city not found");
    return place;
  }

  async function loadWeather(cityName) {
    weatherCity.textContent = cityName;
    weatherTemp.textContent = "--°";
    weatherText.textContent = "…";

    try {
      const place = await resolveCity(cityName);

      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", String(place.latitude));
      url.searchParams.set("longitude", String(place.longitude));
      url.searchParams.set("current", "temperature_2m,weather_code");
      url.searchParams.set("timezone", "auto");

      const response = await fetch(url, { cache:"no-store" });
      if (!response.ok) throw new Error("weather failed");

      const data = await response.json();
      const temp = data?.current?.temperature_2m;
      const code = data?.current?.weather_code;

      weatherCity.textContent = place.name || cityName;
      weatherTemp.textContent = Number.isFinite(temp) ? `${Math.round(temp)}°C` : "--°";
      weatherText.textContent = weatherLabel(code);

      localStorage.setItem(CITY_KEY, place.name || cityName);
    } catch (_) {
      weatherTemp.textContent = "--°";
      weatherText.textContent = "offline";
    }
  }

  weatherReadout.addEventListener("click", () => {
    weatherReadout.hidden = true;
    cityForm.hidden = false;
    cityInput.value = weatherCity.textContent || "";
    cityInput.focus();
    cityInput.select();
  });

  cityCancel.addEventListener("click", () => {
    cityForm.hidden = true;
    weatherReadout.hidden = false;
  });

  cityForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const city = cityInput.value.trim();
    if (!city) return;
    cityForm.hidden = true;
    weatherReadout.hidden = false;
    loadWeather(city);
  });

  // Internet speed: small client-side download estimate, intentionally labeled NET≈.
  async function sampleSpeed() {
    const bytes = 300000;
    const endpoint = `https://speed.cloudflare.com/__down?bytes=${bytes}&t=${Date.now()}`;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 7000);

    try {
      const start = performance.now();
      const response = await fetch(endpoint, { cache:"no-store", signal:controller.signal });
      const blob = await response.blob();
      const seconds = Math.max(.001, (performance.now() - start) / 1000);
      const mbps = (blob.size * 8 / 1_000_000) / seconds;
      netSpeed.textContent = `${mbps.toFixed(1)} Mbps`;
    } catch (_) {
      netSpeed.textContent = "offline";
    } finally {
      clearTimeout(timeout);
    }
  }

  renderLinks();

  const initialCity = localStorage.getItem(CITY_KEY) || "Moscow";
  loadWeather(initialCity);
  sampleSpeed();

  setInterval(() => loadWeather(localStorage.getItem(CITY_KEY) || "Moscow"), 15 * 60 * 1000);
  setInterval(sampleSpeed, 5 * 60 * 1000);
})();


(() => {
  const el = document.querySelector("#quiet-quote");
  if (!el) return;

  const notes = [
    "тишина тоже часть пути.",
    "не всё важное требует скорости.",
    "иногда прогресс выглядит как пауза.",
    "сначала — ясность. потом — движение.",
    "не ищи идеальный момент. продолжай.",
    "внимание — самая тихая форма силы.",
    "пусть следующий шаг будет маленьким, но твоим."
  ];

  let index = 0;

  setInterval(() => {
    index = (index + 1) % notes.length;
    el.classList.add("is-changing");

    setTimeout(() => {
      el.textContent = notes[index];
      el.classList.remove("is-changing");
    }, 500);
  }, 18000);
})();
